<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accra Life</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f3; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* Floating Top HUD */
        .hud-bar {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 10px 20px; border-radius: 20px;
            display: flex; gap: 18px; align-items: center; font-weight: 600; font-size: 13px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 10;
        }
        .money { color: #2e7d32; font-weight: 700; }

        /* Action Menu Panel */
        .action-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 12px 20px; border-radius: 16px;
            display: flex; gap: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); z-index: 10; flex-wrap: wrap; justify-content: center;
        }
        .action-btn {
            background: #2e7d32; color: white; border: none; padding: 10px 16px;
            border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .action-btn:hover { background: #1b5e20; transform: translateY(-1px); }

        /* In-Game Phone Modal */
        .phone-modal {
            display: none; position: absolute; bottom: 90px; right: 20px; width: 280px; height: 420px;
            background: white; border-radius: 24px; box-shadow: 0 10px 35px rgba(0,0,0,0.3);
            z-index: 20; flex-direction: column; overflow: hidden; border: 3px solid #2e7d32;
        }
        .phone-header { background: #2e7d32; color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 14px; }
        .phone-body { flex: 1; padding: 12px; overflow-y: auto; background: #fdfdfd; font-size: 12px; }
        .phone-footer { padding: 10px; background: #f1f1f1; display: flex; gap: 6px; }
        .phone-footer input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 12px; }
        .phone-footer button { background: #2e7d32; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Top Status HUD -->
    <div class="hud-bar">
        <span>Tue 6 - 6:25 PM</span>
        <span>😊 Very Happy</span>
        <span>👥 95k online</span>
        <span class="money">GH₵ 1,510</span>
    </div>

    <!-- Action Buttons -->
    <div class="action-panel">
        <button class="action-btn" onclick="alert('Entering FitGym Accra: Muscle strength increased!')">🏋️ Gym</button>
        <button class="action-btn" onclick="alert('Arrived at Kotoka Airport: Ready for flight booking.')">✈️ Airport</button>
        <button class="action-btn" onclick="alert('Shopping at Accra Mall: Bought new clothes & car!')">🛍️ Shops</button>
        <button class="action-btn" onclick="togglePhone()">📱 Phone & Chat</button>
    </div>

    <!-- Virtual Phone UI -->
    <div class="phone-modal" id="phoneModal">
        <div class="phone-header">Accra Mobile Hub</div>
        <div class="phone-body" id="phoneContent">
            <b>Recent Chats & Friends:</b>
            <div id="chatHistory" style="margin-top: 8px; margin-bottom: 12px;">
                <p><i>Kofi_Accra: Charlie, make we link up for Labadi Beach!</i></p>
                <p><i>Efua_GH: Did you see the new cars at the shops?</i></p>
            </div>
            <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
            <button class="action-btn" style="width:100%; margin-bottom:6px;" onclick="addFriendPrompt()">➕ Add Friend by Username</button>
            <button class="action-btn" style="width:100%; background:#d90429;" onclick="sendMoneyPrompt()">💸 Send Money (MoMo)</button>
        </div>
        <div class="phone-footer">
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <!-- 3D World Canvas -->
    <div id="canvas-container"></div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function togglePhone() {
            const modal = document.getElementById('phoneModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function addFriendPrompt() {
            let username = prompt("Enter your friend's exact username:");
            if (username) alert("Friend request successfully sent to @" + username + "!");
        }

        function sendMoneyPrompt() {
            let recipient = prompt("Enter recipient username or phone number:");
            let amount = prompt("Enter amount in GH₵ to transfer:");
            if (recipient && amount) alert("Successfully sent GH₵" + amount + " to " + recipient + " via mobile money!");
        }

        function sendChatMessage() {
            let input = document.getElementById('chatInput');
            let history = document.getElementById('chatHistory');
            if (input.value.trim() !== "") {
                history.innerHTML += `<p><b>You:</b> ${input.value}</p>`;
                input.value = "";
                history.scrollTop = history.scrollHeight;
            }
        }

        // 3D Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe3f2fd); // Vibrant sky blue

        const aspect = window.innerWidth / window.innerHeight;
        const d = 160;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
        camera.position.set(300, 300, 300);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        dirLight.position.set(200, 300, 200);
        scene.add(dirLight);

        // Base Land
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xc8e6c9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Roads (Cross grid layout)
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x424242 });
        const roadX = new THREE.Mesh(new THREE.PlaneGeometry(500, 50), roadMat);
        roadX.rotation.x = -Math.PI / 2;
        roadX.position.y = 0.5;
        scene.add(roadX);

        const roadZ = new THREE.Mesh(new THREE.PlaneGeometry(50, 500), roadMat);
        roadZ.rotation.x = -Math.PI / 2;
        roadZ.position.y = 0.6;
        scene.add(roadZ);

        // Detailed Building Builder with Roof Trim
        function createBuilding(x, z, w, h, d, wallColor, roofColor) {
            const group = new THREE.Group();

            // Main Structure
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: wallColor });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = h / 2;
            group.add(mesh);

            // Roof Accent
            const roofGeo = new THREE.BoxGeometry(w + 4, 4, d + 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: roofColor });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = h + 2;
            group.add(roof);

            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        // Placed District Buildings (Aligned neatly around roads)
        createBuilding(-90, -90, 45, 35, 45, 0xffb703, 0xfb8500); // Makola Market
        createBuilding(90, -90, 50, 30, 40, 0x219ebc, 0x023047);  // Legon Campus
        createBuilding(-90, 90, 40, 40, 40, 0x8ecae6, 0x219ebc);  // FitGym Accra
        createBuilding(90, 90, 55, 30, 45, 0xe07a5f, 0xd62828);  // Accra Mall & Shops
        createBuilding(0, -90, 35, 25, 35, 0x606c38, 0x283618);   // Player Home

        // Airport Strip
        const airportBase = new THREE.Mesh(new THREE.BoxGeometry(120, 2, 70), new THREE.MeshStandardMaterial({ color: 0xadb5bd }));
        airportBase.position.set(0, 1, -150);
        scene.add(airportBase);

        // Moving Traffic Car
        const carGeo = new THREE.BoxGeometry(14, 7, 22);
        const carMat = new THREE.MeshStandardMaterial({ color: 0xd90429 });
        const car = new THREE.Mesh(carGeo, carMat);
        car.position.set(-150, 4, 0);
        scene.add(car);

        let carDir = 1;

        function animate() {
            requestAnimationFrame(animate);
            car.position.x += 0.8 * carDir;
            if (car.position.x > 150 || car.position.x < -150) {
                carDir *= -1;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
