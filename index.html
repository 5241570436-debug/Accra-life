<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accra Life - Ultimate Edition</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background: #1a1a1a; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* Floating Top HUD */
        .hud-bar {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 8px 20px; border-radius: 20px;
            display: flex; gap: 20px; align-items: center; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10;
        }
        .money { color: #2e7d32; }

        /* Action Menu Panel */
        .action-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 15px 25px; border-radius: 15px;
            display: flex; gap: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 10; flex-wrap: wrap; justify-content: center;
        }
        .action-btn {
            background: #2e7d32; color: white; border: none; padding: 10px 14px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover { background: #1b5e20; }

        /* In-Game Phone Modal */
        .phone-modal {
            display: none; position: absolute; bottom: 100px; right: 30px; width: 300px; height: 450px;
            background: white; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            z-index: 20; flex-direction: column; overflow: hidden; border: 4px solid #333;
        }
        .phone-header { background: #2e7d32; color: white; padding: 12px; text-align: center; font-weight: bold; }
        .phone-body { flex: 1; padding: 15px; overflow-y: auto; background: #f9f9f9; font-size: 13px; }
        .phone-footer { padding: 10px; background: #eee; display: flex; gap: 5px; }
        .phone-footer input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
        .phone-footer button { background: #2e7d32; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Top Status HUD -->
    <div class="hud-bar">
        <span>Tue 6 - 6:25 PM</span>
        <span>😊 Very Happy</span>
        <span>👥 95k online</span>
        <span class="money" id="balance">GH₵ 1,510</span>
    </div>

    <!-- Action Buttons -->
    <div class="action-panel">
        <button class="action-btn" onclick="alert('Entering FitGym Accra: Muscle strength increased!')">🏋️ Gym</button>
        <button class="action-btn" onclick="alert('Arrived at Kotoka Airport: Ready for flight booking.')">✈️ Airport</button>
        <button class="action-btn" onclick="alert('Shopping at Accra Mall: Bought new drip & car!')">🛍️ Shops</button>
        <button class="action-btn" onclick="togglePhone()">📱 Phone & Chat</button>
    </div>

    <!-- Virtual Phone UI (Chat, Add Friend, Send Money) -->
    <div class="phone-modal" id="phoneModal">
        <div class="phone-header">Accra Mobile Hub</div>
        <div class="phone-body" id="phoneContent">
            <b>Recent Chats & Friends:</b>
            <div id="chatHistory" style="margin-top: 10px; margin-bottom: 15px;">
                <p><i>Kofi_Accra: Charlie, make we link up for Labadi Beach!</i></p>
                <p><i>Efua_GH: Did you see the new cars at the shops?</i></p>
            </div>
            <hr>
            <button class="action-btn" style="width:100%; margin-bottom:8px;" onclick="addFriendPrompt()">➕ Add Friend by Username</button>
            <button class="action-btn" style="width:100%; background:#d90429;" onclick="sendMoneyPrompt()">💸 Send Money (MoMo)</button>
        </div>
        <div class="phone-footer">
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <!-- 3D World Canvas -->
    <div id="canvas-container"></div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Toggle Phone UI
        function togglePhone() {
            const modal = document.getElementById('phoneModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        // Add Friend feature
        function addFriendPrompt() {
            let username = prompt("Enter your friend's exact username:");
            if (username) {
                alert("Friend request successfully sent to @" + username + "!");
            }
        }

        // Send Money feature
        function sendMoneyPrompt() {
            let recipient = prompt("Enter recipient username or phone number:");
            let amount = prompt("Enter amount in GH₵ to transfer:");
            if (recipient && amount) {
                alert("Successfully sent GH₵" + amount + " to " + recipient + " via mobile money!");
            }
        }

        // Chat messaging function
        function sendChatMessage() {
            let input = document.getElementById('chatInput');
            let history = document.getElementById('chatHistory');
            if (input.value.trim() !== "") {
                history.innerHTML += `<p><b>You:</b> ${input.value}</p>`;
                input.value = "";
                history.scrollTop = history.scrollHeight;
            }
        }

        // 3D Three.js Isometric Environment Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd8f3dc); 

        const aspect = window.innerWidth / window.innerHeight;
        const d = 180;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
        camera.position.set(250, 250, 250);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        dirLight.position.set(150, 250, 150);
        scene.add(dirLight);

        // Ground Plane
        const groundGeo = new THREE.PlaneGeometry(400, 400);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xb7b7a4 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Building Creator Helper
        function createBuilding(x, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            scene.add(mesh);
            return mesh;
        }

        // World Landmarks
        createBuilding(-60, -60, 40, 30, 40, 0xdda15e); // Makola
        createBuilding(60, -60, 45, 25, 35, 0xbc6c25);  // Legon
        createBuilding(0, -60, 35, 20, 35, 0x606c38);   // Home
        createBuilding(-60, 40, 40, 35, 40, 0xe07a5f);  // Gym
        createBuilding(60, 40, 50, 25, 45, 0x3d405b);  // Accra Mall & Shops
        createBuilding(0, 90, 80, 15, 50, 0x81b29a);   // Kotoka Airport

        // Animated Traffic Car
        const carGeo = new THREE.BoxGeometry(12, 6, 20);
        const carMat = new THREE.MeshStandardMaterial({ color: `[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span)` ? 0xd90429 : 0xd90429 });
        const car = new THREE.Mesh(carGeo, carMat);
        car.position.set(-100, 3, 0);
        scene.add(car);

        let carDirection = 1;

        function animate() {
            requestAnimationFrame(animate);
            car.position.x += 0.5 * carDirection;
            if (car.position.x > 100 || car.position.x < -100) {
                carDirection *= -1;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
